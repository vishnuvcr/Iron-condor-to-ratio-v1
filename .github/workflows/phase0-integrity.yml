name: Phase 0 Integrity

on:
  push:
    branches:
      - main
      - "phase-0-corrections*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required Phase 0 artifacts
        run: |
          set -euo pipefail
          test -f research/OPERATIONAL_CONVENTIONS.md
          test -f research/STRATEGY_SPEC.md
          test -f RESEARCH_PLAN.md
          test -f RESEARCH_STATUS.md
          test -f ERROR_LOG.md
          test -f CONVERSATION_LOG.md
          test -f README.md
          grep -q "max(2 \* tick_size, 0.005 \* reference_price)" research/OPERATIONAL_CONVENTIONS.md
          grep -q "literal-core fallback slippage is fixed" research/STRATEGY_SPEC.md
          grep -q "quote_timestamp <= decision_timestamp" research/OPERATIONAL_CONVENTIONS.md
          grep -q "Root absolute tolerance: 1e-10" research/OPERATIONAL_CONVENTIONS.md
          grep -q "Call lower bound" research/OPERATIONAL_CONVENTIONS.md
          grep -q "Buy fill = ceil(n)\*tick_size" research/OPERATIONAL_CONVENTIONS.md
          grep -q "Phase 1" RESEARCH_STATUS.md
          grep -q "current independent tester approval" RESEARCH_PLAN.md
          grep -q "Current independent tester approval for Phase 0" RESEARCH_STATUS.md
          grep -q "phase-0-corrections-v4" README.md
          grep -q "fourth independent tester" README.md
          grep -q "sensitivity variant" RESEARCH_PLAN.md
          grep -q "fixed literal-core fallback" RESEARCH_PLAN.md
          ! grep -q "Status: BLOCKED BY SECOND TESTER GATE" RESEARCH_PLAN.md
          ! grep -q "| 1 Data | **BLOCKED** | Second tester approval" RESEARCH_STATUS.md
          # B7: line-aware stale-branch assertion.
          # Standard grep does not make \n a cross-line matcher.
          if awk '/^## Current branch$/ { getline; if ($0 == "`phase-0-corrections-v2`") found=1 } END { exit(found ? 0 : 1) }' README.md; then
            echo "ERROR: README still identifies phase-0-corrections-v2 as the current branch"
            exit 1
          fi

      - name: Record exact CI provenance
        if: success()
        run: |
          set -euo pipefail
          echo "Phase 0 Integrity passed for exact commit: ${GITHUB_SHA}"
          echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
