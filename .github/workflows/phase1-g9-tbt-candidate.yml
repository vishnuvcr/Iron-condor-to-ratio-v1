name: Phase 1 G9 TBT Candidate Audit

concurrency:
  group: phase1-g9-tbt-candidate
  cancel-in-progress: true

on:
  push:
    branches:
      - "phase-1-e054-readme-branch-provenance"
    paths:
      - "scripts/validate_g9_tbt_candidate.py"
      - "data/manifests/phase1_control_sources.json"
      - ".github/workflows/phase1-g9-tbt-candidate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/validate_g9_tbt_candidate.py"
      - "data/manifests/phase1_control_sources.json"
      - ".github/workflows/phase1-g9-tbt-candidate.yml"
  workflow_dispatch:

jobs:
  audit-g9-tbt-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install candidate-audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Audit G9 TBT candidate
        run: python scripts/validate_g9_tbt_candidate.py

      - name: Upload G9 candidate audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g9-tbt-candidate-audit
          path: data/validation/g9_tbt_candidate_report.json
          retention-days: 30
