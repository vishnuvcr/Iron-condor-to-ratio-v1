name: Phase 2 Deterministic Engine Tests

on:
  push:
    branches:
      - "phase-2-backtest-engine-20261004"
    paths:
      - "scripts/phase2_backtest_engine.py"
      - "scripts/test_phase2_backtest_engine.py"
      - "scripts/phase2_run_backtest.py"
      - "research/PHASE2_ENGINE_SPEC.md"
      - ".github/workflows/phase2-engine-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/phase2_backtest_engine.py"
      - "scripts/test_phase2_backtest_engine.py"
      - "scripts/phase2_run_backtest.py"
      - "research/PHASE2_ENGINE_SPEC.md"
      - ".github/workflows/phase2-engine-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install pandas pyarrow numpy pytest
      - name: Syntax and unit tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/phase2_backtest_engine.py scripts/phase2_run_backtest.py scripts/test_phase2_backtest_engine.py scripts/test_phase2_cost_schedule.py
          PYTHONPATH=scripts pytest -q scripts/test_phase2_backtest_engine.py
          python scripts/test_phase2_cost_schedule.py
